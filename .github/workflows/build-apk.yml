name: Build APK

on:
  push:
    branches:
      - main
      - 'arena/**'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Install required Android SDK components
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/lib/android-sdk}"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Generate Gradle wrapper (jar not shipped in repo)
        working-directory: NitroBoost
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.7 --no-daemon
          fi

      - name: Build debug APK
        working-directory: NitroBoost
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace > nitroboost-build.log 2>&1
          rc=$?
          tail -150 nitroboost-build.log
          exit $rc

      - name: Capture build log on failure
        if: failure()
        run: |
          set +e
          LOG=NitroBoost/nitroboost-build.log
          # 1) keep the full log on a dedicated branch
          git config user.name "nitroboost-ci"
          git config user.email "ci@nitroboost.local"
          mkdir -p .build-logs
          cp "$LOG" ".build-logs/fail-$GITHUB_RUN_ID.log"
          git add ".build-logs/fail-$GITHUB_RUN_ID.log"
          git commit -m "chore: capture failed build log (run $GITHUB_RUN_ID)"
          git push origin HEAD:build-logs
          # 2) comment the error tail on the open PR so it is readable anywhere
          PR=$(gh pr list --head "$GITHUB_HEAD_REF" --state open --json number --jq '.[0].number' 2>/dev/null)
          if [ -n "$PR" ] && [ "$PR" != "null" ]; then
            {
              echo "## :x: Build failed (run $GITHUB_RUN_ID)"
              echo '```'
              grep -E "^e: |error:|FAILURE|What went wrong|Execution failed for|Caused by|> Task.*FAILED" "$LOG" | head -60
              echo '--- tail ---'
              tail -80 "$LOG"
              echo '```'
            } > /tmp/pr-comment.md
            gh pr comment "$PR" --body-file /tmp/pr-comment.md
          fi
          exit 0

      - name: Upload build log artifact on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-fail-log
          path: NitroBoost/nitroboost-build.log

      - name: Rename APK
        run: mv NitroBoost/app/build/outputs/apk/debug/app-debug.apk NitroBoost/nitroboost-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nitroboost-debug-apk
          path: NitroBoost/nitroboost-debug.apk

      - name: Publish release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nitroboost-v1.0.0
          name: NitroBoost v1.0.0 (debug build)
          body: |
            Debug build of NitroBoost — install on a real device (Shizuku required
            for the full feature set; the app degrades gracefully without it).
          files: NitroBoost/nitroboost-debug.apk
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
