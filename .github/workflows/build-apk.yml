name: Build APK

on:
  push:
    branches:
      - main
      - 'arena/**'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read app version
        id: ver
        working-directory: NitroBoost
        run: |
          python3 - <<'PY'
          import os, re
          text = open("app/build.gradle.kts").read()
          name = re.search(r'versionName\s*=\s*"([^"]+)"', text).group(1)
          code = re.search(r'versionCode\s*=\s*(\d+)', text).group(1)
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"name={name}\n")
              fh.write(f"code={code}\n")
              fh.write(f"tag=nitroboost-v{name}\n")
          print(f"NitroBoost {name} ({code})")
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Install required Android SDK components
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/lib/android-sdk}"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Generate Gradle wrapper (jar not shipped in repo)
        working-directory: NitroBoost
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.7 --no-daemon
          fi

      - name: Run unit tests + build debug APK
        working-directory: NitroBoost
        run: |
          ./gradlew test assembleDebug --no-daemon --stacktrace > nitroboost-build.log 2>&1
          rc=$?
          tail -150 nitroboost-build.log
          exit $rc

      - name: Capture build log on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          LOG=NitroBoost/nitroboost-build.log
          PR=$(gh pr list --head "$GITHUB_HEAD_REF" --state open --json number 2>&1)
          echo "PR-QUERY-OUTPUT: $PR" >> "$LOG"
          PRN=$(echo "$PR" | grep -o '"number":[0-9]*' | head -1 | grep -o '[0-9]*')
          echo "PR-NUMBER: ${PRN:-none}" >> "$LOG"
          git config user.name "nitroboost-ci"
          git config user.email "ci@nitroboost.local"
          mkdir -p .build-logs
          cp "$LOG" ".build-logs/fail-$GITHUB_RUN_ID.log"
          git add ".build-logs/fail-$GITHUB_RUN_ID.log"
          git commit -m "chore: capture failed build log (run $GITHUB_RUN_ID)" >> "$LOG" 2>&1
          git fetch origin build-logs >> "$LOG" 2>&1
          git push origin HEAD:build-logs --force >> "$LOG" 2>&1
          echo "PUSH-EXIT: $?" >> "$LOG"
          if [ -n "$PRN" ]; then
            {
              echo "## :x: Build failed (run $GITHUB_RUN_ID)"
              echo '```'
              grep -E "^e: |error:|FAILURE|What went wrong|Execution failed for|Caused by|> Task.*FAILED" "$LOG" | head -60
              echo '--- tail ---'
              tail -80 "$LOG"
              echo '```'
            } > /tmp/pr-comment.md
            python3 -c 'import json; json.dump({"body": open("/tmp/pr-comment.md").read()}, open("/tmp/pr-comment.json","w"))'
            curl -s -o /tmp/pr-comment-resp.json -w "COMMENT-HTTP:%{http_code}\n" \
              -X POST \
              -H "Authorization: token $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/$PRN/comments" \
              --data @/tmp/pr-comment.json \
              >> "$LOG" 2>&1
            head -c 400 /tmp/pr-comment-resp.json >> "$LOG" 2>&1
          fi
          exit 0

      - name: Upload build log artifact on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-fail-log
          path: NitroBoost/nitroboost-build.log

      - name: Build signed release APK (if signing secrets are configured)
        # NOTE: `secrets` may not appear in step `if:` expressions, so the
        # no-secret case is handled inside the script (empty env = skip).
        # Set the repo secrets NITRO_KEYSTORE_BASE64 (base64 of the .jks),
        # NITRO_KEYSTORE_PASSWORD, NITRO_KEY_ALIAS, NITRO_KEY_PASSWORD and a
        # real signed release is built + published alongside the debug APK.
        # See NitroBoost/docs/DISTRIBUTION.md.
        env:
          KEYSTORE_BASE64: ${{ secrets.NITRO_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.NITRO_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NITRO_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NITRO_KEY_PASSWORD }}
        working-directory: NitroBoost
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No NITRO_KEYSTORE_BASE64 secret — skipping release build"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          export KEYSTORE_FILE=$(pwd)/release.jks
          ./gradlew assembleRelease --no-daemon --stacktrace >> nitroboost-build.log 2>&1
          tail -30 nitroboost-build.log
          mv app/build/outputs/apk/release/app-release.apk nitroboost-release.apk
          rm -f release.jks

      - name: Guard — release APK must never be debuggable
        if: ${{ hashFiles('NitroBoost/nitroboost-release.apk') != '' }}
        run: |
          AAPT2="${ANDROID_SDK_ROOT:-/usr/lib/android-sdk}/build-tools/34.0.0/aapt2"
          if "$AAPT2" dump badging NitroBoost/nitroboost-release.apk | grep -q "application-debuggable"; then
            echo "::error::Release APK is debuggable — refusing to publish"
            exit 1
          fi
          echo "release APK is not debuggable OK"

      - name: Rename APK
        run: mv NitroBoost/app/build/outputs/apk/debug/app-debug.apk NitroBoost/nitroboost-debug.apk

      - name: Collect APK artifacts
        id: collect
        run: |
          FILES="NitroBoost/nitroboost-debug.apk"
          if [ -f NitroBoost/nitroboost-release.apk ]; then
            FILES="$FILES, NitroBoost/nitroboost-release.apk"
          fi
          echo "paths=$FILES" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nitroboost-debug-apk
          path: ${{ steps.collect.outputs.paths }}

      - name: Commit APK to dist branch
        run: |
          set +e
          git config user.name "nitroboost-ci"
          git config user.email "ci@nitroboost.local"
          mkdir -p dist
          cp NitroBoost/nitroboost-debug.apk dist/nitroboost-debug.apk
          [ -f NitroBoost/nitroboost-release.apk ] && cp NitroBoost/nitroboost-release.apk dist/nitroboost-release.apk
          git add dist/
          git commit -m "dist: NitroBoost debug APK (build $GITHUB_RUN_ID)"
          git push origin HEAD:dist-apk --force

      - name: Publish release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: NitroBoost v${{ steps.ver.outputs.name }}
          body: |
            NitroBoost v${{ steps.ver.outputs.name }} (versionCode ${{ steps.ver.outputs.code }})
            — journal-based game booster with a full adaptive A/B engine.

            Install on a real device (Shizuku required for the full feature
            set; the app degrades gracefully without it). Debug-signed build
            for direct install; a signed release APK is published
            automatically once the signing secrets are configured — see
            `NitroBoost/docs/DISTRIBUTION.md`.

            ## v1.6.0 — Stability, thermal safety, recovery hardening
            - **CI unblocked**: journal rotation archives as
              `{filename}_{timestamp}` (the test that kept the last three
              builds red).
            - **Kill/reboot rollback**: `onDestroy` + stale-journal guard
              revert leftover tweaks so a dead session cannot leave
              governors / DND / DPI applied.
            - **Shizuku reconnect wired**: `AndroidExecutor` retries the
              user service before falling back to root / safe mode.
            - **Monitor self-heal**: hub restarts if samples go stale
              (>20s), not only when the last snapshot was empty.
            - **Journal durability**: fsync-before-rename, `.bak` of last
              known-good, skip unknown kinds instead of wiping the file.
            - **Hard thermal floor + predictive slope**: 44/48/52 °C plus
              an early-warning slope so boosts back off before throttling.
            - **More game profiles**: Genshin Global, Star Rail, COD
              Mobile Global, Free Fire MAX, Wild Rift, Roblox, Minecraft.
            - `allowBackup=false` so a backup restore cannot replay a
              journal that no longer matches the device.

            Previous notes: see NitroBoost/CHANGELOG.md and earlier GitHub
            releases (v1.5.1 hardening, v1.5.0 Turbo Kit, v1.4.0 UI).
          files: ${{ steps.collect.outputs.paths }}
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
