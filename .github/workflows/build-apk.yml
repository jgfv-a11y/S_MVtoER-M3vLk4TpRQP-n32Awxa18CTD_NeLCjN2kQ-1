name: Build APK

on:
  push:
    branches:
      - main
      - 'arena/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read app version
        id: ver
        working-directory: NitroBoost
        run: |
          python3 - <<'PY'
          import os, re
          text = open("app/build.gradle.kts").read()
          name = re.search(r'versionName\s*=\s*"([^"]+)"', text).group(1)
          code = re.search(r'versionCode\s*=\s*(\d+)', text).group(1)
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"name={name}\n")
              fh.write(f"code={code}\n")
              fh.write(f"tag=nitroboost-v{name}\n")
          print(f"NitroBoost {name} ({code})")
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Run static verifier
        working-directory: NitroBoost
        run: python3 tools/verify.py
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Install required Android SDK components
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/lib/android-sdk}"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Generate Gradle wrapper (jar not shipped in repo)
        working-directory: NitroBoost
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.7 --no-daemon
          fi

      - name: Run unit tests + build debug APK
        working-directory: NitroBoost
        run: |
          ./gradlew test lintDebug assembleDebug --no-daemon --stacktrace > nitroboost-build.log 2>&1
          rc=$?
          tail -150 nitroboost-build.log
          exit $rc

      - name: Summarize build log on failure
        if: failure()
        run: |
          LOG=NitroBoost/nitroboost-build.log
          if [ -f "$LOG" ]; then
            {
              echo "## Build failed (run $GITHUB_RUN_ID)"
              echo '```text'
              tail -120 "$LOG"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload build log artifact on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-fail-log
          path: NitroBoost/nitroboost-build.log

      - name: Build signed release APK (if signing secrets are configured)
        # NOTE: `secrets` may not appear in step `if:` expressions, so the
        # no-secret case is handled inside the script (empty env = skip).
        # Set the repo secrets NITRO_KEYSTORE_BASE64 (base64 of the .jks),
        # NITRO_KEYSTORE_PASSWORD, NITRO_KEY_ALIAS, NITRO_KEY_PASSWORD and a
        # real signed release is built + published alongside the debug APK.
        # See NitroBoost/docs/DISTRIBUTION.md.
        env:
          KEYSTORE_BASE64: ${{ secrets.NITRO_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.NITRO_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NITRO_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NITRO_KEY_PASSWORD }}
        working-directory: NitroBoost
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No NITRO_KEYSTORE_BASE64 secret — skipping release build"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          export KEYSTORE_FILE=$(pwd)/release.jks
          ./gradlew assembleRelease --no-daemon --stacktrace >> nitroboost-build.log 2>&1
          tail -30 nitroboost-build.log
          mv app/build/outputs/apk/release/app-release.apk nitroboost-release.apk
          rm -f release.jks

      - name: Guard — release APK must never be debuggable
        if: ${{ hashFiles('NitroBoost/nitroboost-release.apk') != '' }}
        run: |
          AAPT2="${ANDROID_SDK_ROOT:-/usr/lib/android-sdk}/build-tools/34.0.0/aapt2"
          if "$AAPT2" dump badging NitroBoost/nitroboost-release.apk | grep -q "application-debuggable"; then
            echo "::error::Release APK is debuggable — refusing to publish"
            exit 1
          fi
          echo "release APK is not debuggable OK"

      - name: Rename APK
        run: mv NitroBoost/app/build/outputs/apk/debug/app-debug.apk NitroBoost/nitroboost-debug.apk

      - name: Collect APK artifacts
        id: collect
        run: |
          FILES="NitroBoost/nitroboost-debug.apk"
          if [ -f NitroBoost/nitroboost-release.apk ]; then
            FILES="$FILES, NitroBoost/nitroboost-release.apk"
          fi
          echo "paths=$FILES" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nitroboost-debug-apk
          path: ${{ steps.collect.outputs.paths }}

      - name: Publish release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: NitroBoost v${{ steps.ver.outputs.name }}
          body: |
            NitroBoost v${{ steps.ver.outputs.name }} (versionCode ${{ steps.ver.outputs.code }})
            — journal-based game booster with a full adaptive A/B engine.

            Install on a real device (Shizuku required for the full feature
            set; the app degrades gracefully without it). Debug-signed build
            for direct install; a signed release APK is published
            automatically once the signing secrets are configured — see
            `NitroBoost/docs/DISTRIBUTION.md`.

            ## v1.13.0 — unified telemetry and frame pacing
            - Added a pure-Kotlin PerformanceSnapshot/SensorFusion layer; unavailable readings remain null, and optional CPU-frequency, battery, memory-pressure, and public device/display data are included only when exposed.
            - Added measured IntendedVsync gaps and FramePacingAnalyzer diagnostics: observed FPS mean/median, measured frame-time percentiles/variance, jank rate, and an explicitly estimated missed-vsync rate.
            - Stability/smoothness scores require at least five measured frame-time samples. Existing A/B weights/decisions, Journal/rollback, privilege checks, and thermal guard are unchanged.
            - GPU utilization/renderer and energy stay null without a trustworthy source; no cloud inference or device benchmark claim is added.

            ## v1.12.0 — safety and session efficiency
            - Profiles/preferences validate package names and ranges, sanitize legacy data, and save custom profiles atomically.
            - Background cleanup excludes the selected game, the booster, protected packages, and resumed activities when Usage Access is available; it is opt-in and requires privilege.
            - Display policy is preserved by default; explicit refresh rates are capped to the reported panel peak and original settings are journaled for restore.
            - Maximum brightness is opt-in at boost level 3 due to its battery and heat cost.
            - Shell output is bounded; interpolated packages, sysfs/settings inputs, and persisted reversal commands are validated before use.
            - Session summaries use constant memory and monitoring stops when no UI/session/overlay consumer remains.
            - CI tests/build and device-specific benchmark status are reported separately; no universal FPS claim is made.

            ## v1.11.0 — adaptive experiment hardening
            - Quality-gated paired baseline/candidate windows alternate measurement order; incomplete, stale, unstable, or thermally contaminated blocks add no evidence.
            - Bounded normalized objective weights and context-bound decisions; unavailable FPS, frame-time, energy, or other metrics are omitted rather than inferred.
            - Session-lifecycle fixes use UsageEvents instead of last-use timestamps, retry transient adaptive-loop failures, and roll back failed boost starts through the journal.
            - Privileged shell commands have bounded execution; thermal safety remains higher priority than performance.
            - Paired interleaving reduces confounding but does not prove identical game workload; no device benchmark claims are made.
            Previous notes: see NitroBoost/CHANGELOG.md and earlier GitHub releases.
          files: ${{ steps.collect.outputs.paths }}
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
