name: Build APK

on:
  push:
    branches:
      - main
      - 'arena/**'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Install required Android SDK components
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/lib/android-sdk}"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Generate Gradle wrapper (jar not shipped in repo)
        working-directory: NitroBoost
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.7 --no-daemon
          fi

      - name: Run unit tests + build debug APK
        working-directory: NitroBoost
        run: |
          ./gradlew test assembleDebug --no-daemon --stacktrace > nitroboost-build.log 2>&1
          rc=$?
          tail -150 nitroboost-build.log
          exit $rc

      - name: Capture build log on failure
        if: failure()
        run: |
          set +e
          LOG=NitroBoost/nitroboost-build.log
          PR=$(gh pr list --head "$GITHUB_HEAD_REF" --state open --json number 2>&1)
          echo "PR-QUERY-OUTPUT: $PR" >> "$LOG"
          PRN=$(echo "$PR" | grep -o '"number":[0-9]*' | head -1 | grep -o '[0-9]*')
          echo "PR-NUMBER: ${PRN:-none}" >> "$LOG"
          git config user.name "nitroboost-ci"
          git config user.email "ci@nitroboost.local"
          mkdir -p .build-logs
          cp "$LOG" ".build-logs/fail-$GITHUB_RUN_ID.log"
          git add ".build-logs/fail-$GITHUB_RUN_ID.log"
          git commit -m "chore: capture failed build log (run $GITHUB_RUN_ID)" >> "$LOG" 2>&1
          git fetch origin build-logs >> "$LOG" 2>&1
          git push origin HEAD:build-logs --force >> "$LOG" 2>&1
          echo "PUSH-EXIT: $?" >> "$LOG"
          if [ -n "$PRN" ]; then
            {
              echo "## :x: Build failed (run $GITHUB_RUN_ID)"
              echo '```'
              grep -E "^e: |error:|FAILURE|What went wrong|Execution failed for|Caused by|> Task.*FAILED" "$LOG" | head -60
              echo '--- tail ---'
              tail -80 "$LOG"
              echo '```'
            } > /tmp/pr-comment.md
            python3 -c 'import json; json.dump({"body": open("/tmp/pr-comment.md").read()}, open("/tmp/pr-comment.json","w"))'
            curl -s -o /tmp/pr-comment-resp.json -w "COMMENT-HTTP:%{http_code}\n" \
              -X POST \
              -H "Authorization: token $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/$PRN/comments" \
              --data @/tmp/pr-comment.json \
              >> "$LOG" 2>&1
            head -c 400 /tmp/pr-comment-resp.json >> "$LOG" 2>&1
          fi
          exit 0

      - name: Upload build log artifact on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-fail-log
          path: NitroBoost/nitroboost-build.log

      - name: Rename APK
        run: mv NitroBoost/app/build/outputs/apk/debug/app-debug.apk NitroBoost/nitroboost-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nitroboost-debug-apk
          path: NitroBoost/nitroboost-debug.apk

      - name: Commit APK to dist branch
        run: |
          set +e
          git config user.name "nitroboost-ci"
          git config user.email "ci@nitroboost.local"
          mkdir -p dist
          cp NitroBoost/nitroboost-debug.apk dist/nitroboost-debug.apk
          git add dist/nitroboost-debug.apk
          git commit -m "dist: NitroBoost debug APK (build $GITHUB_RUN_ID)"
          git push origin HEAD:dist-apk --force

      - name: Publish release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nitroboost-v1.3.0
          name: NitroBoost v1.3.0
          body: |
            NitroBoost — journal-based game booster with a full adaptive A/B
            engine. Install on a real device (Shizuku required for the full
            feature set; the app degrades gracefully without it).
            Debug-signed build for direct install; store builds (signed
            release) are prepared — see `NitroBoost/docs/DISTRIBUTION.md`.

            ## v1.3.0 — Dynamic resolution sweep
            - **Downscale sweep (0.9 / 0.8 / 0.7)**: the adaptive engine
              measures EVERY legal render-downscale level on your device
              against one shared baseline and keeps the winner — real
              dynamic-resolution control for a userland booster.
            - The winning level persists in the decision ledger and is
              restored automatically on every later session.
            - **Stable release** (no longer prerelease).
            - Store distribution prep: optional CI release signing
              (keystore via GitHub secrets) + `docs/DISTRIBUTION.md`
              (Play Store / F-Droid roadmap).
            - +5 JVM unit tests (67 total).

            ## v1.2.0 — Adaptive Engine
            - **A/B adaptive engine**: every performance tweak is tested on
              your device (baseline vs applied, real FPS from gfxinfo) and
              only statistically significant tweaks are kept (paired 95%
              confidence interval). Verdicts persist across sessions in the
              decision ledger; DROPped tweaks are never re-applied.
            - **Bottleneck detector**: live classification of where frames
              are lost (CPU / GPU / memory / network / thermal).
            - **Predictive thermal headroom**: temperature trend can
              de-escalate one tier BEFORE the OS thermal status flips.
            - Dashboard engine card + settings toggle.
            - +32 JVM unit tests (62 total).

            ## v1.1.0
            - **Game API (Android 12+)**: official `cmd game` render downscale
              (80%) via the platform Game Manager — cooler, steadier frames;
              fully journaled, reverted with `cmd game reset`.
            - **OEM game-space detection**: OPlus / ColorOS / MI Game Turbo /
              Samsung / HONOR / vivo / HeyTap are detected and the user is
              advised to enable their game mode too.
            - **Session report**: after every session the app reports measured
              avg/min FPS (gfxinfo), peak temperature, min ping, RAM peak and
              the FPS delta vs the previous session.
            - 16 boost tasks (was 15): +game_api_downscale.
          files: NitroBoost/nitroboost-debug.apk
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
