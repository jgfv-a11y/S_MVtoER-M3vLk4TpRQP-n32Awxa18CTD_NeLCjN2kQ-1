name: Build APK

on:
  push:
    branches:
      - main
      - 'arena/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Safe default for every job. Only publish-release overrides contents access.
permissions:
  contents: read

jobs:
  verify-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      name: ${{ steps.ver.outputs.name }}
      code: ${{ steps.ver.outputs.code }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read app version
        id: ver
        working-directory: NitroBoost
        run: |
          python3 - <<'PY'
          import os, re
          text = open("app/build.gradle.kts", encoding="utf-8").read()
          name = re.search(r'versionName\s*=\s*"([^"]+)"', text).group(1)
          code = re.search(r'versionCode\s*=\s*(\d+)', text).group(1)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"name={name}\n")
              fh.write(f"code={code}\n")
              fh.write(f"tag=nitroboost-v{name}\n")
          print(f"NitroBoost {name} ({code})")
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Run static and security regression checks
        working-directory: NitroBoost
        run: |
          python3 tools/verify.py
          python3 tools/security_verify.py
          python3 -m unittest discover -s tools -p 'test_*.py' -v

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: '8.7'
          cache-provider: basic

      - name: Install required Android SDK components
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/lib/android-sdk}"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Generate Gradle wrapper (jar not shipped in repo)
        working-directory: NitroBoost
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.7 --no-daemon
          fi

      - name: Run unit tests, lint, and build debug APK
        working-directory: NitroBoost
        run: |
          if ! ./gradlew test lintDebug assembleDebug --no-daemon --stacktrace > nitroboost-build.log 2>&1; then
            tail -150 nitroboost-build.log
            exit 1
          fi
          tail -80 nitroboost-build.log
          mv app/build/outputs/apk/debug/app-debug.apk nitroboost-debug.apk

      - name: Summarize build log on failure
        if: failure()
        run: |
          LOG=NitroBoost/nitroboost-build.log
          if [ -f "$LOG" ]; then
            {
              echo "## Build failed (run $GITHUB_RUN_ID)"
              echo '```text'
              tail -120 "$LOG"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            python3 - "$LOG" <<'PY'
          from pathlib import Path
          import sys

          lines = Path(sys.argv[1]).read_text(errors="replace").splitlines()
          diagnostic = "\n".join(lines[-60:])
          diagnostic = diagnostic.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=Gradle build diagnostics::{diagnostic}")
          PY
          fi

      - name: Upload build log artifact on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-fail-log
          path: NitroBoost/nitroboost-build.log

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nitroboost-debug-apk
          path: NitroBoost/nitroboost-debug.apk
          if-no-files-found: error

  prepare-release:
    if: github.ref == 'refs/heads/main'
    needs: verify-build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: '8.7'
          cache-provider: basic

      - name: Install required Android SDK components
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/lib/android-sdk}"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Generate Gradle wrapper (jar not shipped in repo)
        working-directory: NitroBoost
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.7 --no-daemon
          fi

      # Build unsigned in a secret-free, read-only job. The signing job below only runs apksigner.
      - name: Build unsigned release APK
        working-directory: NitroBoost
        run: |
          if ! ./gradlew assembleRelease --no-daemon --stacktrace > nitroboost-release-build.log 2>&1; then
            tail -150 nitroboost-release-build.log
            exit 1
          fi
          tail -80 nitroboost-release-build.log
          APK=app/build/outputs/apk/release/app-release-unsigned.apk
          if [ ! -f "$APK" ]; then
            echo "::error::Expected unsigned release APK not found: $APK"
            find app/build/outputs/apk/release -maxdepth 1 -type f -print || true
            exit 1
          fi
          mv "$APK" nitroboost-release-unsigned.apk

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nitroboost-unsigned-release-apk
          path: NitroBoost/nitroboost-release-unsigned.apk
          if-no-files-found: error

  sign-release:
    if: github.ref == 'refs/heads/main'
    needs: prepare-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      signed: ${{ steps.sign.outputs.signed }}
    steps:
      - name: Download unsigned release APK
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: nitroboost-unsigned-release-apk
          path: NitroBoost

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android Build Tools before exposing signing secrets
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/lib/android-sdk}"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "build-tools;34.0.0"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

      - name: Sign APK only (no Gradle/build scripts in signing job)
        id: sign
        env:
          KEYSTORE_BASE64: ${{ secrets.NITRO_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.NITRO_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NITRO_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NITRO_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] && [ -z "$KEYSTORE_PASSWORD" ] && [ -z "$KEY_ALIAS" ] && [ -z "$KEY_PASSWORD" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "Signing secrets are not configured; the debug APK will still be published."
            exit 0
          fi
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Signing secrets are incomplete; refusing to publish a release APK."
            exit 1
          fi

          BUILD_TOOLS="${ANDROID_SDK_ROOT:-/usr/lib/android-sdk}/build-tools/34.0.0"
          trap 'rm -f release.jks' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > release.jks
          "$BUILD_TOOLS/zipalign" -c -v 4 NitroBoost/nitroboost-release-unsigned.apk
          "$BUILD_TOOLS/apksigner" sign \
            --ks release.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out NitroBoost/nitroboost-release.apk \
            NitroBoost/nitroboost-release-unsigned.apk
          "$BUILD_TOOLS/apksigner" verify --verbose NitroBoost/nitroboost-release.apk
          if "$BUILD_TOOLS/aapt2" dump badging NitroBoost/nitroboost-release.apk | grep -q "application-debuggable"; then
            echo "::error::Release APK is debuggable — refusing to publish"
            exit 1
          fi
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Upload signed release APK
        if: steps.sign.outputs.signed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nitroboost-signed-release-apk
          path: NitroBoost/nitroboost-release.apk
          if-no-files-found: error

  publish-release:
    # Only this job writes GitHub releases; it does not build or hold signing secrets.
    if: github.ref == 'refs/heads/main'
    needs: [verify-build, sign-release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download verified debug APK
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: nitroboost-debug-apk
          path: NitroBoost

      - name: Download signed release APK when available
        if: ${{ needs['sign-release'].outputs.signed == 'true' }}
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: nitroboost-signed-release-apk
          path: NitroBoost

      - name: Collect release assets
        id: collect
        run: |
          FILES="NitroBoost/nitroboost-debug.apk"
          if [ -f NitroBoost/nitroboost-release.apk ]; then
            FILES="$FILES\nNitroBoost/nitroboost-release.apk"
          fi
          {
            echo 'files<<EOF'
            printf '%b\n' "$FILES"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Publish release from main only
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs['verify-build'].outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: NitroBoost v${{ needs['verify-build'].outputs.name }}
          body: |
            NitroBoost v${{ needs['verify-build'].outputs.name }} (versionCode ${{ needs['verify-build'].outputs.code }}).

            This release passed the repository's configured tests, lint, build, and security regression checks. Device-specific gameplay performance has not been independently benchmarked here; no universal FPS gain is claimed.

            See `NitroBoost/CHANGELOG.md` and `NitroBoost/docs/DISTRIBUTION.md` for feature history and installation notes. The attached debug APK is for testing; a signed release APK is attached only when all signing secrets are configured.
          files: ${{ steps.collect.outputs.files }}
          fail_on_unmatched_files: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
